services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sd_2605_mobile_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sd_2605_mobile_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command:
      - bash
      - -c
      - |
        set -e
        bundle install
        rm -f tmp/pids/server.pid
        bundle exec rails db:prepare
        exec bundle exec rails server -b 0.0.0.0 -p 3000
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      RAILS_ENV: development
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy


  frontend:
    build: ./frontend
    command:
      - sh
      - -c
      - |
        npm install && exec npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
      HOME: /tmp
    depends_on:
      - backend

volumes:
  postgres_data:
  bundle:
  frontend_node_modules:
