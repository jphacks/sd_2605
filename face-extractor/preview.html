<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>okearinku — character preview</title>
<style>
  :root {
    color-scheme: dark;
    --panel: #1c1f2b;
    --panel-2: #151824;
    --line: #2c3142;
    --text: #e9ebf3;
    --muted: #8f96ad;
    --accent: #7db8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #11131b;
    color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1440px; margin: 0 auto; padding: 22px 24px 48px; }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .2px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 984px) 340px;
    gap: 20px;
    align-items: start;
  }
  .stage {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    overflow: auto;
  }
  #stage {
    display: block;
    width: 960px;
    height: 720px;
    border-radius: 8px;
    image-rendering: pixelated;
    background: #000;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
    margin: 14px 0 8px;
  }
  .panel h2:first-child { margin-top: 0; }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .field { display: block; }
  .field span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 3px;
  }
  select {
    width: 100%;
    background: #0f121b;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 7px;
    font: inherit;
  }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .extras {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 8px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0f121b;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 5px 7px;
    cursor: pointer;
  }
  .check input { accent-color: var(--accent); margin: 0; }
  .presets { display: flex; gap: 6px; }
  button {
    background: #242a3a;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #2d3448; }
  button.primary { background: #2b5f9e; border-color: #3f7cc4; }
  button.primary:hover { background: #346fae; }
  .presets button { flex: 1; text-transform: capitalize; }
  .copy-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #status { color: var(--muted); font-size: 12px; min-height: 16px; }
  #json {
    margin: 12px 0 0;
    padding: 10px;
    background: #0f121b;
    border: 1px solid var(--line);
    border-radius: 8px;
    max-height: 190px;
    overflow: auto;
    font: 11.5px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #b9c4de;
  }
  .thumbs-head { margin: 26px 0 10px; font-size: 13px; color: var(--muted); }
  #thumbs { display: flex; gap: 14px; flex-wrap: wrap; }
  #thumbs figure { margin: 0; }
  .thumb {
    display: block;
    width: 160px;
    height: 120px;
    border-radius: 8px;
    border: 1px solid var(--line);
    image-rendering: pixelated;
  }
  #thumbs figcaption {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    padding-top: 4px;
  }
  @media (max-width: 1380px) {
    .layout { grid-template-columns: 1fr; }
    #stage { width: 100%; height: auto; max-width: 960px; }
  }
</style>
</head>
<body>
<main>
  <h1>おかえりんく — character preview</h1>
  <p class="sub">Phase 1: 320 × 240, drawn with LovyanGFX-style primitives. Served from <code>face-extractor/</code>.</p>

  <div class="layout">
    <div class="stage">
      <canvas id="stage" width="320" height="240"></canvas>
    </div>

    <aside class="panel">
      <h2>parts</h2>
      <div id="controls" class="controls"></div>

      <h2>extras</h2>
      <div id="extras" class="extras"></div>

      <h2>presets</h2>
      <div class="presets">
        <button type="button" data-preset="boy">boy</button>
        <button type="button" data-preset="girl">girl</button>
        <button type="button" data-preset="friend">friend</button>
      </div>

      <div class="copy-row">
        <button type="button" id="copy" class="primary">copy JSON</button>
        <span id="status" role="status"></span>
      </div>

      <pre id="json"></pre>
    </aside>
  </div>

  <div class="thumbs-head">same character on 4 backgrounds</div>
  <section id="thumbs"></section>
</main>

<script type="module">
import { CATALOG, PALETTE, PRESETS } from "./catalog.mjs";

/* =============================================================================
   Colour
   Colours are 16-bit RGB565 numbers, exactly like faces.h. Keeping them as
   numbers (instead of CSS strings) means every draw call below maps 1:1 to
   LovyanGFX later. css() only exists to hand them to the 2D canvas.
   ========================================================================== */

const rgb565 = (r, g, b) =>
  (((r & 0xf8) << 8) | ((g & 0xfc) << 3) | (b >> 3)) & 0xffff;

const TFT_BLACK = rgb565(0, 0, 0);
const TFT_WHITE = rgb565(255, 255, 255);

// Same constants as faces.h.
const FACE_EYE = rgb565(52, 38, 44);
const FACE_EYE_FRAME = rgb565(20, 14, 18); // darker rim around the coloured iris
const FACE_MOUTH = TFT_BLACK;
const FACE_MOUTH_OPEN = rgb565(60, 24, 36); // dark maroon inside the teeth smile
const FACE_TONGUE = rgb565(246, 132, 146);
const FACE_GLASS = rgb565(58, 50, 62);
const OUTLINE = rgb565(92, 48, 50); // warm dark-brown outline, visible on black hair
const FACE_PI = Math.PI;

function hexTo565(hex) {
  const n = parseInt(hex.slice(1), 16);
  return rgb565((n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff);
}

function unpack565(c) {
  const r = (c >> 11) & 0x1f;
  const g = (c >> 5) & 0x3f;
  const b = c & 0x1f;
  return [(r << 3) | (r >> 2), (g << 2) | (g >> 4), (b << 3) | (b >> 2)];
}

function css(c) {
  const [r, g, b] = unpack565(c);
  return `rgb(${r},${g},${b})`;
}

const to565Map = (obj) =>
  Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, hexTo565(v)]));

const PAL = {
  bg: to565Map(PALETTE.bg),
  hairColor: to565Map(PALETTE.hairColor),
  eyeColor: to565Map(PALETTE.eyeColor),
};

const bg565 = (c) => PAL.bg[c.bg] ?? PAL.bg.sky;
const hair565 = (c) => PAL.hairColor[c.hairColor] ?? PAL.hairColor.black;
const eye565 = (c) => PAL.eyeColor[c.eyeColor] ?? PAL.eyeColor.black;

// Companion colour for the striped fringe: a lighter tint on dark hair and a
// deeper shade on light hair, so both band colours stay distinct.
function hairStripe565(c) {
  const [r, g, b] = unpack565(hair565(c));
  const lum = (r * 299 + g * 587 + b * 114) / 1000;
  if (lum < 80) {
    return rgb565(Math.min(255, r + 55), Math.min(255, g + 40), Math.min(255, b + 60));
  }
  return rgb565(Math.trunc(r * 0.62), Math.trunc(g * 0.62), Math.trunc(b * 0.72));
}

// faces.h hard-codes a blush colour per character. bg is the only style field we
// have, so keep the three faces.h values and use a warm pink for everything else.
const BLUSH_BY_BG = {
  sky: hexTo565("#fa8aa8"),    // BOY
  pink: hexTo565("#f482a5"),   // GIRL
  yellow: hexTo565("#f8ac78"), // FRIEND
};
const BLUSH_DEFAULT = hexTo565("#f58aa8");
const blush565 = (c) => BLUSH_BY_BG[c.bg] ?? BLUSH_DEFAULT;

/* =============================================================================
   Geometry (identical to faces.h)
   ========================================================================== */

const FACE_CX = 160, FACE_CY = 120, FACE_R = 200; // head covers the whole panel
const EYE_Y = 96, EYE_DX = 74, EYE_R = 38; // smaller than faces.h (42)
const EYE_X_L = FACE_CX - EYE_DX; // 86
const EYE_X_R = FACE_CX + EYE_DX; // 234
const GLASS_R = EYE_R + 9;        // 47
const BLUSH_Y = 160, BLUSH_DX = 116, BLUSH_RX = 30, BLUSH_RY = 14;
const MOUTH_Y = 170;

const int = Math.trunc; // C++ int cast / integer division helper

/* =============================================================================
   LovyanGFX-style wrappers
   Same names and arguments as lgfx::LGFXBase, with the target as the first
   argument. Porting a brick to C++ should be a near line-by-line copy:
     fillCircle(g, x, y, r, color)  ->  g.fillCircle(x, y, r, color)
   ========================================================================== */

function fillCircle(g, x, y, r, color) {
  g.fillStyle = css(color);
  g.beginPath();
  g.arc(x, y, r, 0, FACE_PI * 2);
  g.fill();
}

function fillEllipse(g, x, y, rx, ry, color) {
  g.fillStyle = css(color);
  g.beginPath();
  g.ellipse(x, y, rx, ry, 0, 0, FACE_PI * 2);
  g.fill();
}

function fillTriangle(g, x0, y0, x1, y1, x2, y2, color) {
  g.fillStyle = css(color);
  g.beginPath();
  g.moveTo(x0, y0);
  g.lineTo(x1, y1);
  g.lineTo(x2, y2);
  g.closePath();
  g.fill();
}

function drawLine(g, x0, y0, x1, y1, color) {
  g.strokeStyle = css(color);
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(x0 + 0.5, y0 + 0.5);
  g.lineTo(x1 + 0.5, y1 + 0.5);
  g.stroke();
}

function fillRect(g, x, y, w, h, color) {
  g.fillStyle = css(color);
  g.fillRect(x, y, w, h);
}

// 1 px outline, same call shape as g.drawEllipse on the device. faces.h stacks
// three of these at radii 51/50/49 to make the bold spectacle ring.
function drawEllipse(g, x0, y0, rx, ry, color) {
  if (rx <= 0 || ry <= 0) return;
  g.strokeStyle = css(color);
  g.lineWidth = 1.5; // canvas strokes antialias; 1 px would look dashed at 3x
  g.beginPath();
  g.ellipse(x0, y0, rx, ry, 0, 0, FACE_PI * 2);
  g.stroke();
}

// Round-capped stroke of radius r, drawn as a run of circles (faces.h).
function drawFaceStroke(g, x0, y0, x1, y1, r, color) {
  const dx = x1 - x0, dy = y1 - y0;
  const n = Math.max(Math.abs(dx), Math.abs(dy));
  if (n === 0) {
    fillCircle(g, x0, y0, r, color);
    return;
  }
  for (let i = 0; i <= n; ++i) {
    fillCircle(g, x0 + int((dx * i) / n), y0 + int((dy * i) / n), r, color);
  }
}

/* =============================================================================
   Bricks
   Each ID is one small draw function: PARTS[slot][id](g, character).
   slots are drawn in CHARACTER_ORDER by drawCharacter().
   ========================================================================== */

const noop = () => {};

// --- background ---------------------------------------------------------------
// faces.h fills the panel and then a huge head circle; keep both calls.
function paintBg(id) {
  const color = PAL.bg[id];
  return (g) => {
    fillRect(g, 0, 0, 320, 240, color);
    fillCircle(g, FACE_CX, FACE_CY, FACE_R, color);
  };
}

// --- blush (not a CATALOG slot; always drawn under the eyes) -------------------
function drawBlush(g, c) {
  fillEllipse(g, FACE_CX - BLUSH_DX, BLUSH_Y, BLUSH_RX, BLUSH_RY, blush565(c));
  fillEllipse(g, FACE_CX + BLUSH_DX, BLUSH_Y, BLUSH_RX, BLUSH_RY, blush565(c));
}

// --- eyes ---------------------------------------------------------------------
// Open eyes: the chosen colour fills the whole eye with a dark edge, then white
// highlights. Halfmoon keeps the older half-lidded base.
const EYE_FRAME = 5;

function drawEyeBase(g, x, y, rx, ry, c) {
  fillEllipse(g, x, y, rx, ry, FACE_EYE_FRAME);
  fillEllipse(g, x, y, Math.max(1, rx - EYE_FRAME), Math.max(1, ry - EYE_FRAME), eye565(c));
}

function drawEyeBaseSolid(g, x, y, r, c) {
  fillCircle(g, x, y, r, FACE_EYE_FRAME);
  fillCircle(g, x, y, r - 2, eye565(c));
}

// A smooth white crescent along the outer edge: a big white circle, then the
// eye colour drawn back over its inner half.
function drawEyeCrescent(g, x, y, r, c, leftSide) {
  const outer = leftSide ? -1 : 1;
  const dWhite = r - 36;
  const dCover = dWhite - 5;
  fillCircle(g, x + outer * dWhite, y, 32, TFT_WHITE);
  fillCircle(g, x + outer * dCover, y, 32, eye565(c));
}

// Big highlight on the upper-inner side, two bottom dots, and a crescent along
// the outer edge. Lashed gets one larger and one smaller bottom dot.
function drawEyeHighlights(g, x, y, r, c, leftSide, lashed) {
  drawEyeCrescent(g, x, y, r, c, leftSide);

  const inner = leftSide ? 1 : -1;
  const outer = -inner;
  fillCircle(g, x + inner * int(r / 5), y - int(r / 3), int(r / 3), TFT_WHITE);

  const bx = int(r / 3);
  const by = int(r / 3);
  const small = Math.max(3, int(r / 6));
  const big = small + 2;
  fillCircle(g, x + outer * bx, y + by, lashed ? big : small, TFT_WHITE);
  fillCircle(g, x + inner * bx, y + by, lashed ? small - 1 : small, TFT_WHITE);
}

// faces.h: drawFaceEye(), style 0 (open).
function drawEyeRound(g, x, y, r, c) {
  drawEyeBaseSolid(g, x, y, r, c);
  drawEyeHighlights(g, x, y, r, c, x < FACE_CX, false);
}

// Winged eyeliner: a thick upper lid line and a wing at the outer corner.
// The inside highlights match the round eye.
function drawEyeFemale(g, x, y, r, c) {
  const leftSide = x < FACE_CX;
  drawEyeBaseSolid(g, x, y, r, c);
  drawEyeHighlights(g, x, y, r, c, leftSide, false);
  drawEyeliner(g, x, y, r, leftSide);
}

function drawEyeliner(g, x, y, r, leftSide) {
  const outer = leftSide ? -1 : 1;
  const start = leftSide ? 195 : 345;
  const end = leftSide ? 340 : 200;
  const steps = 28;

  // Upper lid line: thick at the outer corner, tapering toward the inner corner.
  for (let i = 0; i <= steps; ++i) {
    const t = i / steps;
    const a = ((start + (end - start) * t) * FACE_PI) / 180;
    const px = x + int((r - 4) * Math.cos(a));
    const py = y + int((r - 4) * Math.sin(a));
    const rad = 2 + int(2 * (1 - t));
    fillCircle(g, px, py, rad, TFT_BLACK);
  }

  // Winged tip at the outer corner.
  const bx = x + outer * (r - 2);
  fillTriangle(g, bx, y - 6, bx - outer * 3, y - 11, x + outer * (r + 11), y - 15, TFT_BLACK);
}

// faces.h: drawFaceLashes(), open eye.
function drawFaceLashes(g, x, y, r, leftSide) {
  const angles = [202, 226, 250];
  for (let i = 0; i < 3; ++i) {
    const a = leftSide ? angles[i] : 180 - angles[i];
    const rad = (a * FACE_PI) / 180;
    const bx = Math.cos(rad), by = Math.sin(rad);
    const px = int(-by * 5), py = int(bx * 5);
    const rx = x + int((r - 2) * bx), ry = y + int((r - 2) * by);
    const tx = x + int((r + 10) * bx), ty = y + int((r + 10) * by);
    fillTriangle(g, rx + px, ry + py, rx - px, ry - py, tx, ty, TFT_BLACK);
  }
}

// faces.h: drawGirlEye(), open eye.
function drawGirlEye(g, x, y, r, c, leftSide) {
  drawEyeBaseSolid(g, x, y, r, c);
  drawEyeHighlights(g, x, y, r, c, leftSide, true);
  drawFaceLashes(g, x, y, r, leftSide);
}

// faces.h: drawFriendEye(), half-moon lid. A filled circle with the top half cut
// away by the face colour, so it reads as a relaxed or smiling half-moon eye.
function drawHalfMoonEye(g, x, y, r, c, leftSide) {
  drawEyeBase(g, x, y, r, r, c);

  // cut the top half away with the body colour
  fillRect(g, x - r - 2, y - r - 4, 2 * r + 4, r + 4, bg565(c));

  // flat lid line along the cut
  drawFaceStroke(g, x - r + 1, y, x + r - 1, y, 2, FACE_EYE_FRAME);

  // two highlights on the remaining bottom half
  const inner = leftSide ? 1 : -1;
  fillCircle(g, x + inner * int(r / 3), y + int(r / 6), 3, TFT_WHITE);
  fillCircle(g, x + inner * int(r / 8), y + int(r / 2), 2, TFT_WHITE);
}

// --- mouth --------------------------------------------------------------------
// faces.h: drawGirlMouth(), the "w" cat mouth.
function drawGirlMouth(g, cx, y) {
  const top = y - 9, bot = y + 9, mid = y - 6;
  drawFaceStroke(g, cx - 24, top, cx - 12, bot, 3, FACE_MOUTH);
  drawFaceStroke(g, cx - 12, bot, cx, mid, 3, FACE_MOUTH);
  drawFaceStroke(g, cx, mid, cx + 12, bot, 3, FACE_MOUTH);
  drawFaceStroke(g, cx + 12, bot, cx + 24, top, 3, FACE_MOUTH);
}

// faces.h: drawFaceSmile(), the friend's "u" smile.
function drawFaceSmile(g, cx, y, w, depth) {
  let oX = 0, oY = 0;
  for (let i = 0; i <= 12; ++i) {
    const t = i / 12;
    const qX = cx - w + int(2 * w * t + 0.5);
    const qY = y + int(depth * (1 - (2 * t - 1) * (2 * t - 1)) + 0.5);
    if (i > 0) drawFaceStroke(g, oX, oY, qX, qY, 3, FACE_MOUTH);
    oX = qX;
    oY = qY;
  }
}

// Wide open grin: dark interior, a white upper-teeth band and a pink tongue.
// Fits above the full-beard chin.
function drawTeethSmile(g) {
  fillEllipse(g, FACE_CX, 171, 34, 16, FACE_MOUTH_OPEN); // mouth interior
  fillEllipse(g, FACE_CX, 161, 26, 4, TFT_WHITE);        // upper teeth band
  fillEllipse(g, FACE_CX + 4, 179, 15, 7, FACE_TONGUE);  // tongue
}

// --- beard --------------------------------------------------------------------
function drawMustache(g, c) {
  const hair = hair565(c);
  fillEllipse(g, FACE_CX - 14, 150, 18, 7, hair);
  fillEllipse(g, FACE_CX + 14, 150, 18, 7, hair);
}

function drawFullBeard(g, c) {
  const hair = hair565(c);
  // Angled sideburns flowing into a solid chin, so the mouth in the middle
  // stays readable and the beard has one continuous silhouette.
  drawFaceStroke(g, FACE_CX - 50, 150, FACE_CX - 48, 194, 10, hair);
  drawFaceStroke(g, FACE_CX + 50, 150, FACE_CX + 48, 194, 10, hair);
  fillEllipse(g, FACE_CX, 212, 54, 26, hair);
  drawMustache(g, c);
}

// --- glasses ------------------------------------------------------------------
// faces.h: three concentric 1 px rings, a 3 px bridge and side arms.
function drawGlassesRound(g) {
  for (let d = 0; d < 3; ++d) {
    drawEllipse(g, EYE_X_L, EYE_Y, GLASS_R - d, GLASS_R - d, FACE_GLASS);
    drawEllipse(g, EYE_X_R, EYE_Y, GLASS_R - d, GLASS_R - d, FACE_GLASS);
  }
  for (let d = -1; d < 2; ++d) {
    drawLine(g, EYE_X_L + GLASS_R - 2, EYE_Y + d, EYE_X_R - GLASS_R + 2, EYE_Y + d, FACE_GLASS);
  }
  drawLine(g, EYE_X_L - GLASS_R + 2, EYE_Y, 8, EYE_Y - 6, FACE_GLASS);
  drawLine(g, EYE_X_R + GLASS_R - 2, EYE_Y, 312, EYE_Y - 6, FACE_GLASS);
}

// Solid rectangular outline from four fillRect strips (3 px, like the round ring).
function drawRectOutline(g, x, y, w, h, t, color) {
  fillRect(g, x, y, w, t, color);
  fillRect(g, x, y + h - t, w, t, color);
  fillRect(g, x, y, t, h, color);
  fillRect(g, x + w - t, y, t, h, color);
}

function drawGlassesSquare(g) {
  const half = EYE_R + 8, t = 3;
  for (const x of [EYE_X_L, EYE_X_R]) {
    drawRectOutline(g, x - half, EYE_Y - half, half * 2, half * 2, t, FACE_GLASS);
  }
  for (let d = -1; d < 2; ++d) {
    drawLine(g, EYE_X_L + half, EYE_Y + d, EYE_X_R - half, EYE_Y + d, FACE_GLASS);
  }
  drawLine(g, EYE_X_L - half, EYE_Y - 6, 8, EYE_Y - 10, FACE_GLASS);
  drawLine(g, EYE_X_R + half, EYE_Y - 6, 312, EYE_Y - 10, FACE_GLASS);
}

// Upswept outer-top corner. side = -1 for the left lens, +1 for the right.
// The top edge sits at y 48-56, just below straight bangs (which reach y 45).
function drawGlassesCatEye(g) {
  const innerDx = EYE_R + 8; // 46
  const botY = EYE_Y + EYE_R + 4;
  for (const side of [-1, 1]) {
    const x = FACE_CX + side * EYE_DX;
    const outerTopX = x + side * (EYE_R + 18);
    const innerX = x - side * innerDx;
    const outerBotX = x + side * (EYE_R + 10);
    drawFaceStroke(g, outerTopX, 48, innerX, 56, 2, FACE_GLASS);
    drawFaceStroke(g, innerX, 56, innerX, botY, 2, FACE_GLASS);
    drawFaceStroke(g, innerX, botY, outerBotX, botY - 4, 2, FACE_GLASS);
    drawFaceStroke(g, outerBotX, botY - 4, outerTopX, 48, 2, FACE_GLASS);
  }
  for (let d = -1; d < 2; ++d) {
    drawLine(g, EYE_X_L + innerDx, EYE_Y + d, EYE_X_R - innerDx, EYE_Y + d, FACE_GLASS);
  }
  drawLine(g, EYE_X_L - (EYE_R + 12), EYE_Y - 4, 8, EYE_Y - 10, FACE_GLASS);
  drawLine(g, EYE_X_R + (EYE_R + 12), EYE_Y - 4, 312, EYE_Y - 10, FACE_GLASS);
}

// --- hair ---------------------------------------------------------------------
// Soft scalloped fringe ("curly"): rounded waves that stop above the eyes.
function drawCurlyBangs(g, c) {
  const hair = hair565(c);
  fillRect(g, 0, 0, 320, 24, hair);
  for (let x = 20; x <= 300; x += 40) fillCircle(g, x, 24, 21, hair);
}

// Round-capped stroke along an ellipse arc (used for the bowl hairline).
function drawEllipseArcStroke(g, cx, cy, rx, ry, startDeg, endDeg, width, color) {
  const span = Math.abs(endDeg - startDeg);
  const steps = Math.max(24, Math.ceil(span));
  const rad = width / 2;
  for (let i = 0; i <= steps; ++i) {
    const t = i / steps;
    const a = ((startDeg + (endDeg - startDeg) * t) * FACE_PI) / 180;
    fillCircle(g, cx + int(rx * Math.cos(a)), cy + int(ry * Math.sin(a)), rad, color);
  }
}

// Bold striped fringe: a full-width cap that reaches the top edge, vertical
// colour bands that fan out from the crown, and thick dark outlines.
function drawStraightBangs(g, c) {
  const base = hair565(c);
  const stripe = hairStripe565(c);

  // Full-width cap with a shallow curved hairline; no side bars and no
  // background showing at the top corners.
  fillRect(g, 0, 0, 320, 70, base);

  // Front stripes fan out from the crown and are cut by the hairline.
  const tops = [64, 128, 192, 256];
  const bottoms = [48, 120, 200, 272];
  for (let i = 0; i < tops.length; ++i) {
    const xTop = tops[i];
    const xBot = bottoms[i];
    const xMid = (xTop + xBot) / 2;
    const xAt = (t) =>
      (1 - t) * (1 - t) * xTop + 2 * (1 - t) * t * xMid + t * t * xBot;
    const yAt = (t) =>
      (1 - t) * (1 - t) * -6 + 2 * (1 - t) * t * 27 + t * t * 64;

    for (let s = 0; s <= 28; ++s) {
      const t = s / 28;
      fillCircle(g, int(xAt(t)), int(yAt(t)), 20, OUTLINE);
    }
    for (let s = 0; s <= 28; ++s) {
      const t = s / 28;
      fillCircle(g, int(xAt(t)), int(yAt(t)), 16, stripe);
    }
  }

  // Cover everything below the curved hairline, then outline the curve. The
  // mask reaches y100 because the round-capped bands overshoot the hairline;
  // the eyes, lashes and glasses are drawn after the hair, so they stay clear.
  for (let x = 0; x < 320; ++x) {
    const dx = (x - 160) / 160;
    const yLine = int(46 + 14 * dx * dx);
    fillRect(g, x, yLine, 1, 100 - yLine, bg565(c));
  }
  for (let x = 0; x <= 320; x += 2) {
    const dx = (x - 160) / 160;
    fillCircle(g, x, int(46 + 14 * dx * dx), 2, OUTLINE);
  }
}

// --- extras -------------------------------------------------------------------
const RIBBON_RED = rgb565(232, 28, 48);
const CLIP_PIN = rgb565(150, 220, 205); // mint bobby pin
const CLIP_PETAL = rgb565(255, 150, 185); // pink petals
const CLIP_CENTER = rgb565(255, 208, 88); // yellow flower centre
const FRECKLE_COLOR = rgb565(132, 78, 56);

// Flower bobby pin on the left fringe: a filled pin with a dark outline and a
// five-petal flower head.
function drawClip(g) {
  // two-pronged pin body
  drawFaceStroke(g, 50, 44, 74, 28, 5, OUTLINE);
  drawFaceStroke(g, 52, 42, 72, 29, 3, CLIP_PIN);
  drawFaceStroke(g, 56, 41, 70, 32, 1, OUTLINE);

  // flower head
  const fx = 84;
  const fy = 22;
  for (let i = 0; i < 5; ++i) {
    const a = (-90 + i * 72) * (Math.PI / 180);
    const px = fx + Math.round(9 * Math.cos(a));
    const py = fy + Math.round(9 * Math.sin(a));
    fillCircle(g, px, py, 7, OUTLINE);
    fillCircle(g, px, py, 5, CLIP_PETAL);
  }
  fillCircle(g, fx, fy, 7, OUTLINE);
  fillCircle(g, fx, fy, 4, CLIP_CENTER);
}

// Big tilted red bow with a dark outline, two rounded loops, loop holes and a
// round knot. Sits on the right side of the fringe.
function drawRibbon(g) {
  // Each loop is a rounded outer end plus a triangle tapering into the knot.
  // The inner shape is 3px smaller, so the outline stays even all the way round.

  // left loop, tilted up
  fillEllipse(g, 222, 27, 14, 19, OUTLINE);
  fillTriangle(g, 262, 30, 222, 8, 222, 46, OUTLINE);
  fillEllipse(g, 222, 27, 11, 16, RIBBON_RED);
  fillTriangle(g, 262, 30, 222, 11, 222, 43, RIBBON_RED);

  // right loop, tilted down
  fillEllipse(g, 298, 34, 14, 19, OUTLINE);
  fillTriangle(g, 262, 30, 298, 15, 298, 53, OUTLINE);
  fillEllipse(g, 298, 34, 11, 16, RIBBON_RED);
  fillTriangle(g, 262, 30, 298, 18, 298, 50, RIBBON_RED);

  // loop holes, just below the knot
  fillCircle(g, 240, 32, 4, OUTLINE);
  fillCircle(g, 240, 32, 2, RIBBON_RED);
  fillCircle(g, 284, 34, 4, OUTLINE);
  fillCircle(g, 284, 34, 2, RIBBON_RED);

  // centre knot
  fillCircle(g, 262, 30, 12, OUTLINE);
  fillCircle(g, 262, 30, 9, RIBBON_RED);
}

function drawFreckles(g) {
  const dots = [
    [-118, -4], [-106, -9], [-94, -3], [-112, -15], [-98, -14],
    [118, -4], [106, -9], [94, -3], [112, -15], [98, -14],
  ];
  for (const [dx, dy] of dots) {
    fillCircle(g, FACE_CX + dx, BLUSH_Y + dy, 2, FRECKLE_COLOR);
  }
}

/* =============================================================================
   PARTS registry
   Every CATALOG ID has a brick. "none" slots are explicit no-ops.
   ========================================================================== */

const PARTS = {
  bg: Object.fromEntries(CATALOG.bg.map((id) => [id, paintBg(id)])),

  blush: { draw: drawBlush }, // pseudo-slot, always on

  eyes: {
    male: (g, c) => {
      drawEyeRound(g, EYE_X_L, EYE_Y, EYE_R, c);
      drawEyeRound(g, EYE_X_R, EYE_Y, EYE_R, c);
    },
    female: (g, c) => {
      drawEyeFemale(g, EYE_X_L, EYE_Y, EYE_R, c);
      drawEyeFemale(g, EYE_X_R, EYE_Y, EYE_R, c);
    },
    halfmoon: (g, c) => {
      drawHalfMoonEye(g, EYE_X_L, EYE_Y, EYE_R, c, true);
      drawHalfMoonEye(g, EYE_X_R, EYE_Y, EYE_R, c, false);
    },
    lashed: (g, c) => {
      drawGirlEye(g, EYE_X_L, EYE_Y, EYE_R, c, true);
      drawGirlEye(g, EYE_X_R, EYE_Y, EYE_R, c, false);
    },
  },

  mouth: {
    tongue: (g) => {
      // faces.h BOY idle: flat top, sloping sides, rounded bottom, tongue.
      fillTriangle(g, FACE_CX - 24, MOUTH_Y - 13, FACE_CX + 24, MOUTH_Y - 13, FACE_CX + 15, MOUTH_Y + 8, FACE_MOUTH);
      fillTriangle(g, FACE_CX - 24, MOUTH_Y - 13, FACE_CX + 15, MOUTH_Y + 8, FACE_CX - 15, MOUTH_Y + 8, FACE_MOUTH);
      fillEllipse(g, FACE_CX, MOUTH_Y + 8, 15, 7, FACE_MOUTH);
      fillEllipse(g, FACE_CX, MOUTH_Y + 7, 17, 10, FACE_TONGUE);
    },
    "teeth-smile": (g) => {
      drawTeethSmile(g);
    },
    "closed-smile": (g) => {
      drawFaceSmile(g, FACE_CX, MOUTH_Y - 4, 12, 9);
    },
    w: (g) => {
      drawGirlMouth(g, FACE_CX, MOUTH_Y);
    },
  },

  beard: {
    none: noop,
    mustache: (g, c) => {
      drawMustache(g, c);
    },
    "full-beard": (g, c) => {
      drawFullBeard(g, c);
    },
  },

  glasses: {
    none: noop,
    round: (g) => {
      drawGlassesRound(g);
    },
    square: (g) => {
      drawGlassesSquare(g);
    },
    "cat-eye": (g) => {
      drawGlassesCatEye(g);
    },
  },

  hair: {
    none: noop,
    "straight-bangs": (g, c) => {
      drawStraightBangs(g, c);
    },
    curly: (g, c) => {
      drawCurlyBangs(g, c);
    },
  },

  extras: {
    clip: (g) => {
      drawClip(g);
    },
    ribbon: (g) => {
      drawRibbon(g);
    },
    freckles: (g) => {
      drawFreckles(g);
    },
  },
};

/* =============================================================================
   Draw order: bg, hair, blush, eyes, mouth, beard, glasses, extras.
   Hair goes behind the face opening, blush, lashes and glasses.
   ========================================================================== */

function drawCharacter(g, c) {
  const draw = (slot, id) => {
    const fn = PARTS[slot][id];
    if (fn) fn(g, c);
  };

  draw("bg", c.bg);
  draw("hair", c.hair);
  PARTS.blush.draw(g, c);
  draw("eyes", c.eyes);
  draw("mouth", c.mouth);
  draw("beard", c.beard);
  draw("glasses", c.glasses);
  for (const id of c.extras) draw("extras", id);
}

function renderTo(canvas, c) {
  const g = canvas.getContext("2d");
  g.clearRect(0, 0, 320, 240);
  drawCharacter(g, c);
}

/* =============================================================================
   UI
   ========================================================================== */

const SLOT_LABELS = {
  bg: "background",
  hairColor: "hair colour",
  hair: "hair",
  eyeColor: "eye colour",
  eyes: "eyes",
  glasses: "glasses",
  beard: "beard",
  mouth: "mouth",
};

const clonePreset = (p) => ({ ...p, extras: [...(p.extras ?? [])] });

let character = clonePreset(PRESETS.boy);

const stage = document.getElementById("stage");
const jsonEl = document.getElementById("json");
const statusEl = document.getElementById("status");

// --- dropdowns, one per CATALOG slot (extras are checkboxes below) -------------
const controlsEl = document.getElementById("controls");
const selects = {};

for (const slot of Object.keys(CATALOG)) {
  if (slot === "extras") continue;

  const label = document.createElement("label");
  label.className = "field";

  const caption = document.createElement("span");
  caption.textContent = SLOT_LABELS[slot] ?? slot;

  const select = document.createElement("select");
  select.dataset.slot = slot;
  for (const id of CATALOG[slot]) {
    const option = document.createElement("option");
    option.value = id;
    option.textContent = id;
    select.append(option);
  }
  select.addEventListener("change", () => {
    character[slot] = select.value;
    refresh();
  });

  selects[slot] = select;
  label.append(caption, select);
  controlsEl.append(label);
}

// --- extras as checkboxes -----------------------------------------------------
const extrasEl = document.getElementById("extras");
const extraBoxes = {};

for (const id of CATALOG.extras) {
  const label = document.createElement("label");
  label.className = "check";

  const box = document.createElement("input");
  box.type = "checkbox";
  box.value = id;
  box.addEventListener("change", () => {
    character.extras = CATALOG.extras.filter((extra) => extraBoxes[extra].checked);
    refresh();
  });

  extraBoxes[id] = box;
  label.append(box, document.createTextNode(id));
  extrasEl.append(label);
}

// --- presets ------------------------------------------------------------------
for (const button of document.querySelectorAll("[data-preset]")) {
  button.addEventListener("click", () => {
    const preset = PRESETS[button.dataset.preset];
    if (!preset) return;
    character = clonePreset(preset);
    syncControls();
    refresh();
  });
}

function syncControls() {
  for (const [slot, select] of Object.entries(selects)) select.value = character[slot];
  for (const [id, box] of Object.entries(extraBoxes)) box.checked = character.extras.includes(id);
}

// --- copy JSON ----------------------------------------------------------------
document.getElementById("copy").addEventListener("click", async () => {
  const text = JSON.stringify(character, null, 2);
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  statusEl.textContent = "copied to clipboard";
  setTimeout(() => {
    if (statusEl.textContent === "copied to clipboard") statusEl.textContent = "";
  }, 1600);
});

// --- 4 background thumbnails --------------------------------------------------
const THUMB_BGS = ["sky", "pink", "yellow", "gray"];
const thumbsEl = document.getElementById("thumbs");
const thumbs = [];

for (const bg of THUMB_BGS) {
  const figure = document.createElement("figure");
  const canvas = document.createElement("canvas");
  canvas.width = 320;
  canvas.height = 240;
  canvas.className = "thumb";

  const caption = document.createElement("figcaption");
  caption.textContent = bg;

  figure.append(canvas, caption);
  thumbsEl.append(figure);
  thumbs.push({ canvas, bg });
}

// --- redraw everything --------------------------------------------------------
function refresh() {
  renderTo(stage, character);
  for (const thumb of thumbs) {
    renderTo(thumb.canvas, { ...character, bg: thumb.bg, extras: [...character.extras] });
  }
  jsonEl.textContent = JSON.stringify(character, null, 2);
}

syncControls();
refresh();
</script>
