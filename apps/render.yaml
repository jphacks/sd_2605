services:
  - type: web
    name: sd-2605-mobile
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sd-2605-mobile-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: sd-2605-mobile-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
